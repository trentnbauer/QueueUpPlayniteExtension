name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build --configuration Release

      - name: Stage extension package
        run: |
          mkdir -p package/QueueUpExporter
          cp extension.yaml package/QueueUpExporter/
          cp bin/Release/net462/QueueUpExporter.dll package/QueueUpExporter/

      - uses: actions/upload-artifact@v4
        with:
          name: QueueUpExporter
          path: package/QueueUpExporter

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd package
          zip -r QueueUpExporter.zip QueueUpExporter
          gh release delete latest --yes || true
          git tag -f latest
          git push origin latest --force
          gh release create latest QueueUpExporter.zip \
            --title "Latest build" \
            --notes "Auto-built from $(git rev-parse --short HEAD). Unzip and drop the QueueUpExporter folder into %AppData%\\Playnite\\Extensions\\, or point Playnite's developer-extension setting at the unzipped folder." \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
