name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # The repo's default GITHUB_TOKEN permissions are read-only - without this, the "Publish
    # latest release" step's `git push origin latest --force` and `gh release create` 403
    # ("Write access to repository not granted"). Confirmed by inspecting the first real run of
    # this workflow on a push to main (after PR #11 merged): it built fine but failed here.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build --configuration Release

      - name: Stage extension package
        run: |
          mkdir -p package/QueueUpExporter
          cp extension.yaml package/QueueUpExporter/
          cp bin/Release/net462/QueueUpExporter.dll package/QueueUpExporter/

      - uses: actions/upload-artifact@v4
        with:
          name: QueueUpExporter
          path: package/QueueUpExporter

      # .pext is Playnite's own installable-extension format (#13) - drag one onto Playnite's open
      # window and it installs itself, no manual folder copy needed. It's not a special container:
      # inspecting a real published extension's .pext confirmed it's a plain zip of extension.yaml +
      # the compiled DLL (and any other extension files) sitting flat at the archive root, no
      # wrapping folder - `zip -j` (junk paths) produces exactly that.
      - name: Build .pext
        run: |
          VERSION=$(grep '^Version:' extension.yaml | awk '{print $2}')
          PEXT_NAME="QueueUpExporter_v${VERSION}.pext"
          zip -j "$PEXT_NAME" extension.yaml bin/Release/net462/QueueUpExporter.dll
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PEXT_NAME=$PEXT_NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pext
          path: ${{ env.PEXT_NAME }}

      - name: Build zip package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd package
          zip -r ../QueueUpExporter.zip QueueUpExporter

      # Bleeding-edge alias: rebuilt and force-moved to HEAD on every push to main, always
      # prerelease so it never satisfies GitHub's own "latest release" API/UI (which explicitly
      # excludes prereleases - see FetchLatestReleaseVersion's doc comment in
      # QueueUpExporterPlugin.cs) - that's what routes ordinary users to the versioned release
      # below instead of every single commit.
      - name: Publish "latest" (bleeding-edge) release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          gh release delete latest --yes || true
          git tag -f latest
          git push origin latest --force
          gh release create latest QueueUpExporter.zip "$PEXT_NAME" \
            --title "Latest build (bleeding edge)" \
            --notes "Unreleased build auto-published from every push to main - may be ahead of, or less tested than, the current stable release. Built from $(git rev-parse --short HEAD). Most people want the stable release instead: https://github.com/trentnbauer/QueueUpPlayniteExtension/releases/latest" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      # Real, permanent release - one per extension.yaml Version, published the first time a
      # push to main carries that Version (skipped on every push in between where it's unchanged,
      # so not every merge mints a new release). Not force-moved like "latest" above: once
      # published, a versioned release always points at the exact commit it shipped from. This is
      # what CheckForUpdate/GitHub's own "latest release" API resolve to, since it's the only
      # non-prerelease release in the repo.
      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (extension.yaml Version wasn't bumped in this push) - skipping."
            exit 0
          fi
          gh release create "$TAG" QueueUpExporter.zip "$PEXT_NAME" \
            --title "$TAG" \
            --notes "Built from $(git rev-parse --short HEAD). Easiest install: download the .pext file and drag it onto Playnite's open window - it installs itself. Alternative: unzip QueueUpExporter.zip and drop the folder into %AppData%\\Playnite\\Extensions\\, or point Playnite's developer-extension setting at the unzipped folder."
        env:
          GH_TOKEN: ${{ github.token }}
